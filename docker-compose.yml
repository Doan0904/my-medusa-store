services:
  # 1. Database
  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=medusa-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis
  redis:
    image: redis:latest
    restart: always

  # 3. Medusa Backend
  medusa:
    image: medusajs/medusa:latest
    ports:
      - "9000:9000"
      - "7001:7001"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/medusa-db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=something_very_secret
      - COOKIE_SECRET=something_very_secret
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
