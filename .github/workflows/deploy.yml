name: Deploy Medusa to CapRover

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # BƯỚC QUAN TRỌNG: Đưa code từ thư mục con ra thư mục gốc để CapRover thấy
      - name: Prepare Workspace
        run: |
          cp my-medusa-store/captain-definition ./
          cp my-medusa-store/Dockerfile ./
          # Bạn có thể dùng lệnh cp -r nếu Dockerfile cần các file khác ở cùng cấp
          # Nhưng tạm thời cứ đưa 2 file này ra gốc là GitHub Action sẽ chạy được

      - name: Deploy to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER_URL }}
          app: 'zang-finance-app'
          token: ${{ secrets.CAPROVER_APP_TOKEN }}
          # XÓA DÒNG PATH CŨ ĐI VÌ NÓ KHÔNG HỖ TRỢ
