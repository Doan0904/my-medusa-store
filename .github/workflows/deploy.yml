name: Deploy Medusa to CapRover

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle and Deploy
        run: |
          # 1. Chui vào tận cùng nơi chứa code Medusa
          # Dựa trên log của Zang, đường dẫn đúng là:
          cd my-medusa-store/my-medusa-store
          
          # 2. Đóng gói toàn bộ code thành file deploy.tar
          tar -cvf ../../deploy.tar .
          
          # 3. Đẩy file này lên CapRover
          cd ../../
          npx caprover deploy \
            --caproverUrl "${{ secrets.CAPROVER_SERVER_URL }}" \
            --appToken "${{ secrets.CAPROVER_APP_TOKEN }}" \
            --appName "zang-finance-app" \
            --tarFile "./deploy.tar"
