name: Deploy Medusa to CapRover

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to CapRover via CLI
        # Lệnh này sẽ chui vào thư mục con và ra lệnh deploy trực tiếp
        run: |
          cd my-medusa-store
          npx caprover deploy \
            --caproverUrl "${{ secrets.CAPROVER_SERVER_URL }}" \
            --appToken "${{ secrets.CAPROVER_APP_TOKEN }}" \
            --appName "zang-finance-app" \
            --branch "main"
