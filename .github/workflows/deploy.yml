name: Deploy Medusa to CapRover

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install caprover CLI
        run: npm install -g caprover

      - name: Bundle and Deploy
        run: |
          cd my-medusa-store
          tar -czf ../deploy.tar.gz .
          cd ..
          caprover deploy \
            --caproverUrl "${{ secrets.CAPROVER_SERVER_URL }}" \
            --appToken "${{ secrets.CAPROVER_APP_TOKEN }}" \
            --appName "zang-finance-app" \
            --tarFile "./deploy.tar.gz"
